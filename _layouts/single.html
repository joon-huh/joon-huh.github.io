---
layout: default
---
<article class="page">
  <header class="page-header">
    {% if page.collection == 'publications' %}
      <a class="back-link" href="{{ '/publications/' | relative_url }}">&larr; All publications</a>
    {% endif %}
    <h1>{{ page.title }}</h1>
  </header>
  <div class="page-content">
    {% if page.collection == 'publications' %}
      <div class="publication-details">{{ page.excerpt | markdownify }}</div>
    {% endif %}
    {{ content }}
  </div>
</article>
