<aside class="profile" aria-label="About {{ site.author.name }}">
  <img class="profile-photo" src="{{ site.author.avatar | prepend: '/images/' | relative_url }}" alt="{{ site.author.name }}" width="170" height="186" decoding="async">
  <div class="profile-info">
    <p class="profile-name">{{ site.author.name }}</p>
    <p class="profile-bio">{{ site.author.bio }}</p>
    <ul class="profile-links" aria-label="Contact and profiles">
      {% if site.author.googlescholar %}<li><a href="{{ site.author.googlescholar }}">Google Scholar</a></li>{% endif %}
      {% if site.author.github %}<li><a href="https://github.com/{{ site.author.github }}">GitHub</a></li>{% endif %}
      {% if site.author.twitter %}<li><a href="https://twitter.com/{{ site.author.twitter }}">X / Twitter</a></li>{% endif %}
    </ul>
  </div>
</aside>
