<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign description = page.description | default: page.excerpt | default: site.description | markdownify | strip_html | normalize_whitespace %}
<title>{{ page.title | escape }} · {{ site.title | escape }}</title>
<meta name="description" content="{{ description | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ description | escape }}">
<meta property="og:type" content="{% if page.collection == 'publications' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:image" content="{{ '/images/profile.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#fdfcfb">
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
