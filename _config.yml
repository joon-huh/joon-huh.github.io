title: "Joon Suk Huh"
description: "Ph.D. student in Computer Science at UW–Madison. Research in online machine learning, game theory, and mechanism design."
url: "https://joon-huh.github.io"
baseurl: ""
locale: "en-US"

author:
  name: "Joon Suk Huh"
  avatar: "profile.jpg"
  bio: "Ph.D. student in Computer Science at UW–Madison"
  googlescholar: "https://scholar.google.com/citations?user=oXYG5-QAAAAJ&hl=en"
  github: "joon-huh"
  twitter: "joonhuh__"

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - preview.sh
  - vendor

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  publications:
    output: true
    permalink: /publications/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: single

future: true
timezone: America/Chicago
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
